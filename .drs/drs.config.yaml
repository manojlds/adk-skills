review:
  default:
    model: opencode-go/glm-5

  mode: unified

  agents:
  - unified-reviewer
  
  unified:
    severityThreshold: HIGH

  ignorePatterns:
    - "test_*.py"
    - "*_test.py"
    - "**/__pycache__/**"
    - "**/.pytest_cache/**"
    - "**/tests/**"
    - "**/__tests__/**"
    - "**/mocks/**"
    - "**/__mocks__/**"
    - "uv.lock"
    - "requirements*.txt"
    - "**/*.egg-info/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/examples/**"

  describe:
    enabled: true
    postDescription: true

describe:
  model: opencode-go/glm-5
  includeProjectContext: true

contextCompression:
  enabled: true
  thresholdPercent: 0.15
  maxTokens: 32000
  softBufferTokens: 1500
  hardBufferTokens: 1000
  tokenEstimateDivisor: 4
